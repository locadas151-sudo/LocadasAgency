<div class="field"><label for="whatsapp_number">WhatsApp-Nummer für deinen Locadas-Sekretär <small>(Handy)</small></label><input id="whatsapp_number" name="whatsapp_number" type="tel" inputmode="tel" autocomplete="tel" value="{{ ('+' ~ business.whatsapp_number) if business.whatsapp_number else '' }}" placeholder="0171 2345678"></div>
<label class="toggle"><input type="checkbox" name="whatsapp_opt_in" value="1" {% if business.whatsapp_opt_in %}checked{% endif %}><div><b>Ja, schreib mir per WhatsApp statt per Mail</b><span>Dein Sekretär schreibt dir, bevor er nachfasst, wenn ein Kunde öffnet oder antwortet, und fragt am Ende, wie es ausging. Du antwortest mit einem Knopf, ins Dashboard musst du nicht. Abmelden geht jederzeit mit „abmelden“ im Chat.{% if not settings.whatsapp_enabled %} WhatsApp wird gerade freigeschaltet, bis dahin kommt alles per Mail.{% endif %}</span></div></label>
