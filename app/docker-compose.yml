services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      INBOUND_SMTP_PORT: ${INBOUND_SMTP_PORT:-2525}
    volumes:
      - locadas-data:/data
    expose:
      - "8000"
    ports:
      # Weiterleitungsadressen *@INBOUND_DOMAIN: Port 25 außen auf den SMTP-Empfänger im Container (nimmt nur diese Domain an, kein Relay)
      - "25:2525"
    healthcheck:
      # DB erreichbar, Scheduler läuft, letzter Durchlauf nicht zu alt, SMTP-Empfänger lauscht (200 sonst 503)
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.locadas.de}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  locadas-data:
  caddy-data:
  caddy-config:
