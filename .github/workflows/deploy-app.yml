name: Deploy Nachfasser (app/) to AWS
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy-app.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-app
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt pytest aiosmtpd reportlab
      - run: cd app && python -m pytest -q
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      AWS_HOST: ${{ secrets.AWS_HOST }}
    steps:
      - name: Secrets vorhanden?
        id: check
        run: |
          if [ -z "$AWS_HOST" ]; then
            echo "::notice::AWS_HOST nicht gesetzt, Deploy übersprungen (siehe app/DEPLOY.md)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
      - name: SSH-Key einrichten
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: .env aus Secrets bauen
        if: steps.check.outputs.skip == 'false'
        run: |
          cat > app/.env <<EOF
          BASE_URL=${{ vars.APP_BASE_URL || 'https://app.locadas.de' }}
          APP_DOMAIN=${{ vars.APP_DOMAIN || 'app.locadas.de' }}
          SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
          ENCRYPTION_KEY=${{ secrets.APP_ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL=${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
          SCAN_INTERVAL_MINUTES=10
          OFFER_FOLLOWUP_DAYS=3,7,14
          INVOICE_FOLLOWUP_DAYS=3,10,20
          APPROVALS_BEFORE_AUTO=0
          INITIAL_SCAN_DAYS=30
          SEND_HOUR_FROM=8
          SEND_HOUR_TO=18
          TZ=Europe/Berlin
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET=${{ secrets.MICROSOFT_CLIENT_SECRET }}
          WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET=${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_DISPLAY_NUMBER=${{ vars.WHATSAPP_DISPLAY_NUMBER }}
          INBOUND_DOMAIN=${{ vars.INBOUND_DOMAIN || 'angebot.locadas.de' }}
          INBOUND_SMTP_PORT=2525
          INBOUND_WEBHOOK_SECRET=${{ secrets.INBOUND_WEBHOOK_SECRET }}
          SYSTEM_SMTP_HOST=${{ secrets.SYSTEM_SMTP_HOST }}
          SYSTEM_SMTP_PORT=${{ vars.SYSTEM_SMTP_PORT || '587' }}
          SYSTEM_SMTP_USER=${{ secrets.SYSTEM_SMTP_USER }}
          SYSTEM_SMTP_PASSWORD=${{ secrets.SYSTEM_SMTP_PASSWORD }}
          ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}
          ADMIN_WHATSAPP=${{ secrets.ADMIN_WHATSAPP }}
          ADMIN_NAME=${{ vars.ADMIN_NAME || 'Julius' }}
          ADMIN_DIGEST_HOUR=${{ vars.ADMIN_DIGEST_HOUR || '19' }}
          BACKUP_S3_BUCKET=${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX=${{ vars.BACKUP_S3_PREFIX || 'locadas/' }}
          SCAN_WORKERS=${{ vars.SCAN_WORKERS || '8' }}
          SCAN_ACCOUNT_TIMEOUT=${{ vars.SCAN_ACCOUNT_TIMEOUT || '300' }}
          INBOUND_TLS_CERT=${{ vars.INBOUND_TLS_CERT }}
          INBOUND_TLS_KEY=${{ vars.INBOUND_TLS_KEY }}
          EOF
      - name: Dateien auf den Server kopieren
        if: steps.check.outputs.skip == 'false'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.AWS_USER || 'ubuntu' }}@${{ secrets.AWS_HOST }}" "mkdir -p ~/locadas-app"
          rsync -az --delete --exclude tests --exclude __pycache__ -e "ssh -i ~/.ssh/deploy_key" app/ "${{ secrets.AWS_USER || 'ubuntu' }}@${{ secrets.AWS_HOST }}:~/locadas-app/"
      - name: Container bauen und starten
        if: steps.check.outputs.skip == 'false'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.AWS_USER || 'ubuntu' }}@${{ secrets.AWS_HOST }}" '
            cd ~/locadas-app &&
            (docker compose version >/dev/null 2>&1 || (curl -fsSL https://get.docker.com | sudo sh && sudo usermod -aG docker $USER)) &&
            docker compose up -d --build --remove-orphans &&
            docker image prune -f >/dev/null &&
            sleep 5 && docker compose ps'
